name: Novel OS stress

on:
  push:
    paths:
      - 'scripts/**'
      - 'research/evidence/**'
      - 'research/claims/**'
      - 'reviews/**/chapter_*_review_v2.md'
      - 'revisions/**'
      - 'characters/**'
      - 'worldbuilding/**'
      - 'plot/**'
      - 'examples/phase3-lifecycle/**'
      - 'evals/**'
      - 'config/upstreams.json'
      - 'package.json'
      - '.github/workflows/novel-os-stress.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'research/evidence/**'
      - 'research/claims/**'
      - 'reviews/**/chapter_*_review_v2.md'
      - 'revisions/**'
      - 'characters/**'
      - 'worldbuilding/**'
      - 'plot/**'
      - 'examples/phase3-lifecycle/**'
      - 'evals/**'
      - 'config/upstreams.json'
      - 'package.json'
      - '.github/workflows/novel-os-stress.yml'
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned skills locally
        run: npm run bootstrap -- --clean
      - name: Run Reliability Layer v2 regression guards
        run: npm run reliability:test
      - name: Verify registered SQLite evidence
        run: npm run evidence:check
      - name: Verify registered claim contracts
        run: npm run claim:check
      - name: Verify v2 review contracts
        run: npm run review:check
      - name: Verify forward-only durable state writes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "[STATE-COMMIT-GUARD] No usable base commit; no forward changeset to inspect."
          else
            npm run state:check -- --base "$BASE"
          fi
      - name: Run mechanical stress fixture
        run: npm run stress:test
      - name: Run full authoring lifecycle fixture
        run: npm run lifecycle:test
